name: BestBuy Backup Watcher

on:
  schedule:
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Set true to send a test [BACKUP-SIMULATION] alert"
        required: false
        default: "false"
      sku:
        description: "Limit this run to one SKU (blank = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bestbuy-backup
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Best Buy availability and alert if in stock
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SIMULATE: ${{ github.event.inputs.simulate }}
          ONLY_SKU: ${{ github.event.inputs.sku }}
        run: |
          set -euo pipefail

          # sku|name|condition|url — must mirror PRODUCTS in src/worker.js.
          PRODUCTS="14350718|Canon PowerShot G7 X Mark III|OPEN BOX|https://www.bestbuy.ca/en-CA/product/open-box-canon-powershot-g7-x-mark-iii-wi-fi-20-1mp-4-2x-optical-zoom-digital-camera-black/14350718"

          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          # %7C = "|", the multi-SKU separator this API expects; a comma 412s.
          SKUS=$(echo "$PRODUCTS" | cut -d'|' -f1 | tr -d ' ' | paste -sd'@' - | sed 's/@/%7C/g')
          API="https://www.bestbuy.ca/ecomm-api/availability/products?accept=application%2Fvnd.bestbuy.standardproduct.v1%2Bjson&accept-language=en-CA&skus=${SKUS}"

          echo "Polling $API"
          RESP=$(curl -sS -A "$UA" -H "Accept: application/vnd.bestbuy.standardproduct.v1+json" -H "Accept-Language: en-CA" "$API")
          echo "Raw response: $RESP"

          FAILED=0
          while IFS='|' read -r SKU PRODUCT_NAME CONDITION PRODUCT_URL; do
            SKU=$(echo "$SKU" | tr -d ' ')
            [ -z "$SKU" ] && continue
            if [ -n "${ONLY_SKU:-}" ] && [ "$SKU" != "$ONLY_SKU" ]; then
              echo "$SKU: skipped (run limited to $ONLY_SKU)"
              continue
            fi

            REC=$(echo "$RESP" | jq -c --arg s "$SKU" '.availabilities[]? | select((.sku|tostring) == $s)')
            if [ -z "$REC" ]; then
              echo "ERROR: no availability record for $SKU" >&2
              FAILED=1
              continue
            fi

            SHIPPING_STATUS=$(echo "$REC" | jq -r '.shipping.status // "Unknown"')
            SHIPPING_PURCHASABLE=$(echo "$REC" | jq -r '.shipping.purchasable // false')
            BACKORDERABLE=$(echo "$REC" | jq -r '.shipping.isBackorderable // false')
            QTY=$(echo "$REC" | jq -r '.shipping.quantityRemaining // 0')
            PICKUP_PURCHASABLE=$(echo "$REC" | jq -r '.pickup.purchasable // false')
            PICKUP_STATUS=$(echo "$REC" | jq -r '.pickup.status // "Unknown"')

            echo "$SKU: shipping=$SHIPPING_STATUS purchasable=$SHIPPING_PURCHASABLE backorder=$BACKORDERABLE qty=$QTY pickup=$PICKUP_STATUS"

            SIGNAL="out"
            TITLE_PREFIX="[BACKUP]"
            COLOR=2895667
            if [ "$SHIPPING_PURCHASABLE" = "true" ]; then
              SIGNAL="in_stock_online"
              TITLE="BACK IN STOCK — Available Online"
              COLOR=3066993
            elif [ "$BACKORDERABLE" = "true" ]; then
              SIGNAL="backorder"
              TITLE="BACKORDER AVAILABLE"
              COLOR=15844367
            elif [ "$PICKUP_PURCHASABLE" = "true" ]; then
              SIGNAL="pickup_only"
              TITLE="IN-STORE PICKUP AVAILABLE"
              COLOR=3447003
            fi

            if [ "${SIMULATE:-false}" = "true" ]; then
              SIGNAL="in_stock_online"
              TITLE="BACK IN STOCK — Available Online"
              COLOR=10181046
              TITLE_PREFIX="[BACKUP-SIMULATION]"
              echo "Simulation mode: forcing in-stock alert for $SKU"
            fi

            if [ "$SIGNAL" = "out" ]; then
              echo "$SKU: out of stock. No alert."
              continue
            fi

            if [ -z "${DISCORD_WEBHOOK:-}" ]; then
              echo "ERROR: DISCORD_WEBHOOK secret not set" >&2
              exit 1
            fi

            PAYLOAD=$(jq -n \
              --arg title "$TITLE_PREFIX [$CONDITION] $TITLE" \
              --arg desc "**$PRODUCT_NAME**\n$CONDITION · SKU $SKU\n\n_Sent by GitHub Actions backup watcher (independent from the Cloudflare Worker)._" \
              --arg url "$PRODUCT_URL" \
              --argjson color "$COLOR" \
              --arg condition "$CONDITION" \
              --arg shipping "$SHIPPING_STATUS" \
              --arg pickup "$PICKUP_STATUS" \
              --arg qty "$QTY" \
              --arg backorder "$BACKORDERABLE" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                username: "BestBuy Backup Watcher",
                embeds: [{
                  title: $title,
                  description: $desc,
                  url: $url,
                  color: $color,
                  fields: [
                    {name: "Condition", value: $condition, inline: true},
                    {name: "Shipping", value: $shipping, inline: true},
                    {name: "Pickup", value: $pickup, inline: true},
                    {name: "Qty", value: $qty, inline: true},
                    {name: "Backorderable", value: $backorder, inline: true}
                  ],
                  timestamp: $ts,
                  footer: {text: "GitHub Actions backup • bestbuy.ca availability API"}
                }]
              }')

            echo "Posting to Discord for $SKU..."
            HTTP=$(curl -sS -o /tmp/discord_resp.txt -w "%{http_code}" \
              -X POST -H "Content-Type: application/json" \
              -d "$PAYLOAD" "$DISCORD_WEBHOOK")
            echo "Discord HTTP $HTTP"
            if [ "$HTTP" -ge 400 ]; then
              echo "Discord error response:"
              cat /tmp/discord_resp.txt
              exit 1
            fi
            echo "Alert sent for $SKU."
          done <<< "$PRODUCTS"

          exit $FAILED

      - name: Ping heartbeat (optional)
        if: success()
        env:
          HEALTHCHECK_URL_BACKUP: ${{ secrets.HEALTHCHECK_URL_BACKUP }}
        run: |
          if [ -n "${HEALTHCHECK_URL_BACKUP:-}" ]; then
            curl -sS -m 10 "$HEALTHCHECK_URL_BACKUP" || true
          else
            echo "HEALTHCHECK_URL_BACKUP not set — skipping heartbeat ping"
          fi

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          [ -z "${DISCORD_WEBHOOK:-}" ] && exit 0
          PAYLOAD=$(jq -n \
            --arg url "$RUN_URL" \
            '{
              username: "BestBuy Watcher",
              embeds: [{
                title: "[BACKUP-ERROR] Backup watcher run failed",
                description: ("GitHub Actions run failed. Investigate: " + $url),
                color: 15158332,
                timestamp: (now | todateiso8601)
              }]
            }')
          curl -sS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
